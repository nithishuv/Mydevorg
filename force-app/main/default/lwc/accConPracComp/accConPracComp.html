<template>
    <lightning-card variant="Narrow" title="Contacts" icon-name="standard:account">


        <lightning-card title={title}>
            <template if:true={isAccountSelected}>
                <template if:true={hasContacts}>
                    <template for:each={contacts} for:item="con">
                        <lightning-layout key={con.Id} class="slds-box">
                            <lightning-layout-item>
                                <b>{con.Name}</b>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>
                </template>

                <template if:false={hasContacts}>
                   <div class= 'slds-align_absolute-center'> No Contacts Found</div>
                </template>
            </template>
            <template if:false={isAccountSelected}>
                <div class= 'slds-align_absolute-center'>No Account Selected</div>
                </template>
        </lightning-card>
    </lightning-card>


</template>
